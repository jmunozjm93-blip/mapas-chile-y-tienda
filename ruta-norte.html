function expand(on){$('sheet').classList.toggle('expanded',on);$('handle').setAttribute('aria-expanded',String(on));$('handle').setAttribute('aria-label',on?'Cerrar lista de tiendas':'Abrir lista de tiendas')}
function drawChips(){$('chips').innerHTML=['Todas',...cities].map(c=>`<button class="chip ${city===c?'active':''}" data-city="${c}" aria-pressed="${city===c}">${c==='Todas'?'Toda la ruta':c}</button>`).join('');$('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{city=b.dataset.city;query='';$('search').value='';drawChips();updateMarkers();renderList();const a=ids();if(a.length)select(a[0],false);fit(a);expand(false)})}
function icon(i){return L.divIcon({className:'pin'+(i===active?' selected':''),html:'<span><b>'+(i+1)+'</b></span>',iconSize:i===active?[42,42]:[34,34],iconAnchor:i===active?[21,42]:[17,34]})}
function updateMarkers(){if(!map)return;const visible=ids();markers.forEach((m,i)=>{if(visible.includes(i)){if(!map.hasLayer(m))m.addTo(map);m.setIcon(icon(i));m.setZIndexOffset(i===active?1000:0)}else if(map.hasLayer(m))map.removeLayer(m)})}
function padding(){return innerWidth>760?{paddingTopLeft:[440,150],paddingBottomRight:[70,70]}:{paddingTopLeft:[40,140],paddingBottomRight:[65,310]}}
function fit(a){if(map&&a.length){map.invalidateSize();map.fitBounds(L.latLngBounds(a.map(i=>[stops[i].lat,stops[i].lng])),{...padding(),maxZoom:15,animate:false})}}
function select(i,focus=true){active=i;const p=stops[i],leg=savedRoute.legs[i];$('kicker').textContent=cityOf(p)+' · Parada '+(i+1)+' de '+stops.length;$('name').textContent=p.name;$('address').textContent=p.addr;$('stores').innerHTML=p.stores.length?p.stores.map(s=>'<span class="store">'+esc(s.name)+'</span>').join(''):'<span class="store">Destino final · centro de referencia</span>';$('travel').innerHTML=leg?'<strong>'+fmt(leg.duration)+'</strong> · '+km(leg.distance)+' hasta '+esc(stops[i+1].name):'Fin del recorrido · tiempos sin tráfico en vivo';$('navigate').href=google(p);const a=ids(),pos=a.indexOf(i);$('prev').disabled=pos<=0;$('next').disabled=pos<0||pos>=a.length-1;updateMarkers();renderList();expand(false);if(focus&&map){map.setView([p.lat,p.lng],16,{animate:false});map.panBy(innerWidth>760?[-190,0]:[0,90],{animate:false})}}
function renderList(){const a=ids();$('listtitle').textContent=query?'Resultados de búsqueda':city==='Todas'?'Todo el recorrido':city;$('summary').textContent=a.length+' paradas visibles · Total del viaje: '+km(savedRoute.distance)+' · '+fmt(savedRoute.duration);$('results').innerHTML=a.length?a.map(i=>{const p=stops[i];return `<button class="row ${i===active?'selected':''}" data-stop="${i}"><span class="num">${i+1}</span><span><b>${esc(p.name)}</b><small>${esc(p.addr)}${p.stores.length>1?' · '+p.stores.length+' tiendas':''}</small></span><span class="chev">›</span></button>${savedRoute.legs[i]?'<div class="legrow">'+fmt(savedRoute.legs[i].duration)+' en auto a '+esc(stops[i+1].name)+'</div>':''}`}).join(''):'<p class="empty">No encontramos esa tienda. Prueba con otra ciudad o nombre.</p>';if(!query&&(city==='Copiapó'||city==='Todas'))$('results').innerHTML+=`<div class="note"><b>Otras tiendas de Copiapó</b><br>No incluidas en el trazado ni en los tiempos.<br><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Hites%20Chacabuco%20373%20Copiapo">Hites · Chacabuco 373 ↗</a><br><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=La%20Polar%20Ohiggins%20550%20Copiapo">La Polar / ABC · O’Higgins 550 ↗</a></div>`;$('results').innerHTML+='<div class="note">Tiempos estimados por OSRM, sin tráfico en vivo, visitas ni estacionamiento. Tiendas y coordenadas del <a href="https://jmunozjm93-blip.github.io/mapas-chile-y-tienda/" target="_blank" rel="noopener">mapa original</a>. Tiendas del mismo mall comparten parada. Santiago usa el centro como referencia. Otras tiendas: <a href="https://www.hites.com/nuestras-tiendas" target="_blank" rel="noopener">Hites</a> y <a href="https://www.abc.cl/listado-de-tiendas.html" target="_blank" rel="noopener">ABC</a>.</div>';$('results').querySelectorAll('[data-stop]').forEach(b=>b.onclick=()=>{select(Number(b.dataset.stop));$('search').blur()})}
if(window.L){map=L.map('map',{zoomControl:false,scrollWheelZoom:true}).setView([-27.37,-70.33],14);if(location.protocol==='file:'){toast('Abre la versión publicada para cargar el mapa.');$('map').innerHTML='<a style="position:absolute;top:150px;left:20px;z-index:500" href="https://jmunozjm93-blip.github.io/mapas-chile-y-tienda/ruta-norte.html">Abrir mapa publicado ↗</a>'}else{const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',maxZoom:19}).addTo(map);let tileFailed=false;tiles.on('tileerror',()=>{if(tileFailed)return;tileFailed=true;toast('No se pudo cargar una parte del mapa. Puedes usar Cómo llegar para navegar.')})}routeLayer=L.geoJSON(savedRoute.geometry,{style:{color:'#1a73e8',weight:6,opacity:.9}}).addTo(map);routeLayer.on('click',e=>{const a=ids().filter(i=>i<stops.length-1);if(!a.length)return;const i=a.reduce((best,j)=>map.distance(e.latlng,[stops[j].lat,stops[j].lng])<map.distance(e.latlng,[stops[best].lat,stops[best].lng])?j:best,a[0]);select(i,false);toast('Desde '+stops[i].name+': '+fmt(savedRoute.legs[i].duration)+' a '+stops[i+1].name)});markers=stops.map((p,i)=>L.marker([p.lat,p.lng],{icon:icon(i),title:p.name,alt:p.name,keyboard:true}).on('click',()=>select(i)));}else toast('No se pudo cargar el mapa. La lista y Cómo llegar siguen disponibles.');
$('list').onclick=()=>expand(true);$('close').onclick=()=>expand(false);$('handle').onclick=()=>expand(!$('sheet').classList.contains('expanded'));$('prev').onclick=()=>{const a=ids();select(a[a.indexOf(active)-1])};$('next').onclick=()=>{const a=ids();select(a[a.indexOf(active)+1])};$('overview').onclick=()=>{city='Todas';query='';$('search').value='';drawChips();updateMarkers();renderList();select(active,false);fit(ids());toast('Ruta completa · '+km(savedRoute.distance)+' · '+fmt(savedRoute.duration))};$('search').oninput=e=>{query=e.target.value;city='Todas';drawChips();updateMarkers();renderList();expand(true);fit(ids())};$('clear').onclick=()=>{query='';$('search').value='';drawChips();updateMarkers();renderList();fit(ids());$('search').blur();expand(false)};$('zoom-in').onclick=()=>map?.zoomIn();$('zoom-out').onclick=()=>map?.zoomOut();$('locate').onclick=()=>{if(!navigator.geolocation){toast('Este navegador no permite obtener tu ubicación.');return}toast('Buscando tu ubicación…');navigator.geolocation.getCurrentPosition(pos=>{if(!map)return;const p=[pos.coords.latitude,pos.coords.longitude];if(locationMarker)map.removeLayer(locationMarker);locationMarker=L.circleMarker(p,{radius:8,color:'white',weight:3,fillColor:'#4285f4',fillOpacity:1}).addTo(map);map.setView(p,15);expand(false);toast('Tu ubicación está marcada en azul.')},()=>toast('No se pudo obtener tu ubicación. Revisa el permiso de ubicación del navegador.'),{timeout:12000,maximumAge:60000})};let touchStart; $('swipe').addEventListener('touchstart',e=>{if(e.target.closest('.stores,button,a'))return;touchStart=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});$('swipe').addEventListener('touchend',e=>{if(!touchStart)return;const dx=e.changedTouches[0].clientX-touchStart[0],dy=e.changedTouches[0].clientY-touchStart[1];touchStart=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){const a=ids(),n=a.indexOf(active)+(dx<0?1:-1);if(n>=0&&n<a.length)select(a[n])}},{passive:true});drawChips();select(0,false);fit(ids());window.addEventListener('resize',()=>{map?.invalidateSize()});
</script></body></html>
